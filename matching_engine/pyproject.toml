[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyr-matching"
version = "0.2.0"
description = "Motor independiente de emparejamiento estudiante-plaza (Paz y Región, Universidad de Ibagué): Excel in / Excel out, explicable y reentrenable."
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
test = ["pytest>=8"]

[project.scripts]
pyr-match = "pyr_matching.cli:main"

[tool.setuptools.packages.find]
include = ["pyr_matching*"]

[tool.setuptools.package-data]
pyr_matching = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["embeddings: requires the optional sentence-transformers stack and a local model"]
